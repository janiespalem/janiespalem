<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Fiodar — level 19</title>
  <desc id="desc">An arcade character card for a Python backend developer. Side quests got out of hand. Open to work.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#d9f96a" stroke-opacity=".055"/>
    </pattern>
  </defs>
  <rect width="1200" height="430" rx="16" fill="#111b18"/>
  <rect x="1" y="1" width="1198" height="428" rx="15" fill="url(#grid)" stroke="#34463a"/>
  <g font-family="'DejaVu Sans Mono', monospace">
    <rect x="36" y="31" width="10" height="10" fill="#d9f96a"/>
    <text x="58" y="43" fill="#d9f96a" font-size="16" letter-spacing="2">JANIESPALEM / PLAYER FILE</text>
    <text x="1164" y="43" text-anchor="end" fill="#a6b8ab" font-size="14" letter-spacing="2">NO TUTORIAL SKIPPED*</text>
    <path d="M36 65H1164" stroke="#34463a"/>

    <text x="31" y="181" fill="#eef0db" font-size="104" font-weight="700" letter-spacing="-7">FIODAR<tspan fill="#d9f96a">.</tspan></text>
    <text x="38" y="227" fill="#d9f96a" font-size="22" letter-spacing="2">PYTHON BACKEND DEVELOPER</text>
    <text x="38" y="269" fill="#a6b8ab" font-size="19">side quests got out of hand.</text>
    <text x="38" y="312" fill="#788d7e" font-size="13">*currently fighting the documentation boss</text>

    <path d="M891 96H1158V314H903V326H891Z" fill="#34463a"/>
    <path d="M879 84H1146V302H891V314H879Z" fill="#d9f96a"/>
    <text x="901" y="115" fill="#111b18" font-size="15" font-weight="700" letter-spacing="3">CURRENT LEVEL</text>
    <text x="1009" y="258" text-anchor="middle" fill="#111b18" font-size="165" font-weight="700" letter-spacing="-13">19</text>
    <text x="1012" y="288" text-anchor="middle" fill="#111b18" font-size="12" font-weight="700" letter-spacing="2">FINAL BOSS IN TRAINING</text>

    <path d="M36 346H1164" stroke="#34463a"/>
    <text x="38" y="382" fill="#eef0db" font-size="15" letter-spacing="1">REAL TOOLS. WEIRD SIDE QUESTS.</text>
    <rect x="945" y="364" width="219" height="30" rx="3" fill="#d9f96a"/>
    <circle cx="963" cy="379" r="4" fill="#111b18"/>
    <text x="982" y="384" fill="#111b18" font-size="14" font-weight="700" letter-spacing="1">OPEN TO WORK</text>
  </g>
